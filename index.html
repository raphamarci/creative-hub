/* V2.1 — semantic color system, works in dark and light mode */
:root{--home-color:#a78bfa;--videos-color:#50b9ec;--packaging-color:#f3a65c;--shots-color:#4bd4b0;--editing-color:#f17aa9;--inspiration-color:#c5a0ff;--workflow-color:#f1ca66}
body.light{--home-color:#7951c5;--videos-color:#0876b5;--packaging-color:#a95c11;--shots-color:#087c65;--editing-color:#b32d65;--inspiration-color:#7540b7;--workflow-color:#a36a08}
.nav{width:100%;position:relative;transition:background .15s,color .15s}
.nav-workflow{--section-color:var(--workflow-color)}.nav-home{--section-color:var(--home-color)}.nav-videos{--section-color:var(--videos-color)}.nav-packaging{--section-color:var(--packaging-color)}.nav-shots{--section-color:var(--shots-color)}.nav-editing{--section-color:var(--editing-color)}.nav-inspiration{--section-color:var(--inspiration-color)}
.nav.active{color:var(--section-color);background:color-mix(in srgb,var(--section-color) 13%,var(--side));box-shadow:inset 3px 0 0 var(--section-color)}
.nav:hover:not(.active){color:var(--section-color);background:color-mix(in srgb,var(--section-color) 7%,var(--side))}
body[data-section=workflow]{--current-accent:var(--workflow-color)}body[data-section=home]{--current-accent:var(--home-color)}body[data-section=videos]{--current-accent:var(--videos-color)}body[data-section=packaging]{--current-accent:var(--packaging-color)}body[data-section=shots]{--current-accent:var(--shots-color)}body[data-section=editing]{--current-accent:var(--editing-color)}body[data-section=inspiration]{--current-accent:var(--inspiration-color)}
main h1{border-left:4px solid var(--current-accent,var(--home-color));padding-left:14px}
main .primary{background:var(--current-accent,var(--button));color:#101116}
main .primary:hover{filter:brightness(1.08)}
.card{border-top:3px solid var(--current-accent,var(--home-color))}
.card:nth-child(4n+2){border-top-color:var(--videos-color)}.card:nth-child(4n+3){border-top-color:var(--packaging-color)}.card:nth-child(4n+4){border-top-color:var(--shots-color)}
.tablewrap thead{background:color-mix(in srgb,var(--current-accent,var(--home-color)) 10%,var(--panel))}

.entry-row:nth-child(even){background:color-mix(in srgb,var(--current-accent,var(--home-color)) 3%,transparent)}

/* V2.2 semantic packaging outlines and visual library */
.pack-grid,.visual-grid,.guide-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:16px}
.pack-tile{--edge:var(--line);background:var(--panel);border:2px solid var(--edge);border-radius:14px;padding:17px;display:flex;flex-direction:column;gap:10px;min-height:210px}
.pack-tile.easy{--edge:#27c69c}.pack-tile.moderate{--edge:#f1ad4c}.pack-tile.planned{--edge:#a88af4}
.pack-tile h3,.visual-tile h3,.guide-tile h3{font-size:15px;line-height:1.4;margin:0}
.pack-tile .tilefoot{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:auto}
.tile-meta{font-size:12px;color:var(--muted);line-height:1.45}.tile-actions{display:flex;gap:12px}
.tile-actions button{background:none;border:none;color:var(--accent);padding:4px}
.visual-tile,.guide-tile{background:var(--panel);border:1px solid var(--line);border-radius:15px;overflow:hidden}
.visual-tile img{display:block;width:100%;height:175px;object-fit:cover;background:var(--panel2)}
.visual-tile .tilebody,.guide-tile .tilebody{padding:16px;display:grid;gap:9px}
.guide-tile{border-top:3px solid var(--editing-color)}
.guide-tile ol{padding-left:21px;margin:4px 0;line-height:1.6;color:var(--text);font-size:13px}
.guide-tile li{margin-bottom:6px}
.guide-tile summary{cursor:pointer;color:var(--accent);font-size:13px;font-weight:650}
.workflow-head{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.workflow-head select,.workflow-note{background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:9px;padding:10px;width:100%}
.workflow-note{min-height:90px;resize:vertical}
.stage{display:flex;gap:13px;align-items:start;padding:14px;border-bottom:1px solid var(--line)}
.stage input{margin-top:5px;accent-color:var(--workflow-color);width:18px;height:18px}
.stage label{flex:1;cursor:pointer}
.stage small{display:block;color:var(--muted);line-height:1.5;margin-top:5px}
.workflow-columns{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(280px,1fr);gap:18px;margin-top:20px}
@media(max-width:950px){.workflow-columns{grid-template-columns:1fr}}

.library-toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:9px}
.library-toolbar input{flex:1 1 230px;min-width:160px}
.library-toolbar select{max-width:220px}
.view-switch{display:inline-flex;gap:3px;padding:3px;background:var(--panel2);border:1px solid var(--line);border-radius:10px}
.view-switch button{border:0;border-radius:7px;padding:8px 12px;background:transparent;color:var(--muted);cursor:pointer;font-weight:650}
.view-switch button.selected{background:var(--panel);color:var(--text);box-shadow:0 1px 5px #0002}
.tablewrap{overflow-x:auto}
.entry-packaging{border-left:3px solid transparent}
.entry-packaging:has(.pill-easy){border-left-color:#27c69c}
.entry-packaging:has(.pill-moderate){border-left-color:#f1ad4c}
.entry-packaging:has(.pill-planned){border-left-color:#a88af4}
@media(max-width:680px){.library-toolbar select{max-width:none;flex:1}.view-switch{width:100%;justify-content:center}}

function libraryContent(k,rows){const cols=schema[k].filter(x=>x[0]!=='notes');return libraryPrefs(k).mode==='table'?table(k,rows,cols):k==='packaging'?packagingCards(rows):k==='shots'?shotCards(rows):k==='editing'?editingCards(rows):genericCards(k,rows)}
function conceptVisual(k,r){if(!['playbook','epilogue','philosophy'].includes(k))return '';let t=r.title;let v=k==='epilogue'?'▶　···　✦':k==='philosophy'?'▤':t.includes('tracking')?'<span style="letter-spacing:-3px">weeeeeeee</span>　<span style="letter-spacing:4px">weeee</span>':t.includes('typography')?'W e ₑ ₑ':t.includes('Kerning')?'AV　 A V':t.includes('Emotional')?'♡':t.includes('composition')?'◎':'◇';return `<div class="visual-diagram">${v}</div>`}function genericCards(k,rows){return `<div class="pack-grid">${rows.map(r=>`<article class="pack-tile ${esc(String(r.feasibility||'').toLowerCase())}">${conceptVisual(k,r)}<h3>${esc(r.title)}</h3>${r.status?`<div><span class="pill pill-${esc(String(r.status).toLowerCase().replace(/[^a-z]+/g,"-"))}">${esc(r.status)}</span></div>`:""}${schema[k].filter(x=>x[0]!=='title'&&x[0]!=='notes'&&x[0]!=='status').map(([field,label])=>`<div class="tile-meta"><b>${esc(label)}:</b> ${esc(r[field]||'—')}</div>`).join('')}<div class="tile-meta">${esc(r.notes||'')}</div><div class="tilefoot"><div class="tile-actions"><button onclick="edit('${k}',${r.id})">Edit</button><button onclick="removeItem('${k}',${r.id})">Delete</button></div></div></article>`).join('')}</div>`}
function listing(k){const labels={playbook:['Packaging Playbook','Emotional principles, typography and final evaluation.'],epilogue:['Epilogue','Optional bonus scenes after the main ending.'],philosophy:['Project Philosophy','Creative identity and quality standards.'],videos:['100-Video Tracker','Individual videos, available footage, and production status.'],packaging:['Packaging Library','Reusable titles, thumbnail ideas, and feasibility.'],shots:['Shot Library','Repeatable footage setups and visual motifs.'],editing:['Editing Playbook','Recurring jokes, annotations, and editing techniques.'],phrases:['Extra Phrases Library','Specific everyday-life suffixes appended after a | in a title.'],inspiration:['Inspiration Board','Links and notes for visual references.']};const [title,subtitle]=labels[k],rows=libraryRows(k),prefs=libraryPrefs(k);const filters=['videos','packaging'].includes(k)?['All','Easy','Moderate','Planned']:['All'];const sorts=[['default','Original order'],...schema[k].filter(x=>x[0]!=='notes').map(([key,label])=>[key,label])];return `<div class="top"><div><h1>${title}</h1><p>${subtitle} · ${data[k].length} entries</p></div><button class="primary" onclick="edit('${k}')">+ Add ${k==='videos'?'video':'entry'}</button></div><div class="toolbar library-toolbar"><input aria-label="Search" placeholder="Search this section…" value="${esc(query)}" oninput="query=this.value;refreshTable('${k}')"><select aria-label="Feasibility filter" onchange="filter=this.value;refreshTable('${k}')">${filters.map(f=>`<option ${filter===f?'selected':''}>${f}</option>`).join('')}</select><select aria-label="Sort by" onchange="changeLibraryPref('${k}','sort',this.value)">${sorts.map(([key,label])=>`<option value="${esc(key)}" ${prefs.sort===key?'selected':''}>Sort: ${esc(label)}</option>`).join('')}</select><button class="secondary" title="Reverse sort direction" onclick="changeLibraryPref('${k}','direction','${prefs.direction==='asc'?'desc':'asc'}')">${prefs.direction==='asc'?'↑ Asc':'↓ Desc'}</button><div class="view-switch" role="group" aria-label="View mode"><button class="${prefs.mode==='cards'?'selected':''}" onclick="changeLibraryPref('${k}','mode','cards')" aria-pressed="${prefs.mode==='cards'}">▦ Cards</button><button class="${prefs.mode==='table'?'selected':''}" onclick="changeLibraryPref('${k}','mode','table')" aria-pressed="${prefs.mode==='table'}">☷ Table</button></div><button class="secondary" onclick="exportCSV('${k}')">Export CSV</button></div><p class="tiny muted" id="resultsCount" style="margin:10px 0 16px">${rows.length} matching entries · View and sort preferences are remembered</p><div id="tableTarget">${libraryContent(k,rows)}</div>`}

oncrete step.</p><textarea class="workflow-note" oninput="setWorkflowField('next',this.value)" placeholder="Example: review the 20 minutes of Halloween street footage…">${esc(w.next)}</textarea></div><div class="panel"><h2>Story and editing notes</h2><p class="tiny">Keep timecodes, funny moments, missing shots, and packaging thoughts here.</p><textarea class="workflow-note" style="min-height:200px" oninput="setWorkflowField('notes',this.value)" placeholder="00:42 — funny reaction…">${esc(w.notes)}</textarea></div><div class="panel"><h2>Quick navigation</h2><div class="tile-actions"><button onclick="nav('packaging')">Packaging Library</button><button onclick="nav('editing')">Editing Playbook</button><button onclick="nav('playbook')">Packaging Playbook</button><button onclick="nav('shots')">Shot Library</button><button onclick="nav('epilogue')">Epilogue</button><button onclick="nav('philosophy')">Project Philosophy</button></div></div></div></div>`}

function table(k,rows,cols){return `<div class="tablewrap">${rows.length?`<table><thead><tr>${cols.map(c=>`<th>${esc(c[1])}</th>`).join('')}<th>Actions</th></tr></thead><tbody>${rows.map(r=>`<tr class="entry-row entry-${k}">${cols.map(c=>`<td>${['feasibility','status','priority'].includes(c[0])?`<span class="pill pill-${String(r[c[0]]||"unknown").toLowerCase().replace(/[^a-z]+/g,"-")}">${esc(r[c[0]])}</span>`:esc(r[c[0]])}</td>`).join('')}<td class="actions"><button onclick="edit('${k}',${r.id})">Edit</button><button onclick="removeItem('${k}',${r.id})">Delete</button></td></tr>`).join('')}</tbody></table>`:'<div class="empty">No matching entries. Clear the filters or add an idea.</div>'}</div>`}function refreshTable(k){const rows=libraryRows(k);document.getElementById('tableTarget').innerHTML=libraryContent(k,rows);const counter=document.getElementById('resultsCount');if(counter)counter.textContent=rows.length+' matching entries · View and sort preferences are remembered'}
function edit(k,id=null){editCollection=k;editId=id;const record=id?data[k].find(r=>r.id===id):{};document.getElementById('modalTitle').textContent=(id?'Edit ':'Add ')+({videos:'video',packaging:'packaging idea',shots:'shot',editing:'editing technique',inspiration:'inspiration',phrases:'extra phrase',playbook:'principle',epilogue:'bonus scene',philosophy:'principle'}[k]);document.getElementById('formFields').innerHTML=schema[k].map(([key,label,type])=>`<label class="field ${type==='textarea'?'wide':''}">${esc(label)}${type?.startsWith('select:')?`<select name="${key}">${type.slice(7).split('|').map(o=>`<option ${record[key]===o?'selected':''}>${esc(o)}</option>`).join('')}</select>`:type==='textarea'?`<textarea name="${key}">${esc(record[key])}</textarea>`:`<input name="${key}" value="${esc(record[key])}" ${key==='title'?'required':''}>`}</label>`).join('');hubDraft=Array.isArray(record.images)?[...record.images]:[];hubPreview();document.getElementById('editor').showModal()}
document.getElementById('editForm').addEventListener('submit',e=>{e.preventDefault();if(hubBusy){alert('Wait for images to finish processing.');return;}const item=Object.fromEntries(new FormData(e.target).entries());item.images=[...hubDraft];if(editId){Object.assign(data[editCollection].find(x=>x.id===editId),item)}else{item.id=Math.max(0,...data[editCollection].map(x=>x.id))+1;data[editCollection].unshift(item)}save();document.getElementById('editor').close();render()});function removeItem(k,id){if(confirm('Delete this entry?')){data[k]=data[k].filter(x=>x.id!==id);save();render()}}function checkTask(id,done){data.tasks.find(x=>x.id===id).done=done;save();render()}function toggleTheme(){data.settings.theme=data.settings.theme==='dark'?'light':'dark';save();render()}
function download(name,text,mime){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:mime}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}function showUpgradeHelp(){alert('UPGRADE FROM PREVIOUS VERSION\n\n1. Open your OLD Creative_Hub.html in the browser you normally use.\n2. Click Export backup. Save Creative_Hub_Backup.json.\n3. Open THIS V3.0 HTML file.\n4. Click Import backup and choose that JSON file.\n5. Confirm replacement. Your existing entries and progress are retained, and V3.0 ideas are merged in automatically.\n6. Export a fresh backup for safekeeping.\n\nBrowser data is tied to the file origin/path. Keep the new HTML in one consistent location.');}
function exportData(){download('Creative_Hub_Backup.json',JSON.stringify(data,null,2),'application/json')}function exportCSV(k){const keys=schema[k].map(x=>x[0]);const q=s=>'"'+String(s??'').replace(/"/g,'""')+'"';download('Creative_Hub_'+k+'.csv',[keys.join(','),...data[k].map(r=>keys.map(key=>q(r[key])).join(','))].join('\r\n'),'text/csv')}async function importData(e){const f=e.target.files[0];if(!f)return;try{const obj=JSON.parse(await f.text());if(!obj.videos||!obj.packaging||!Array.isArray(obj.videos)||!Array.isArray(obj.packaging))throw Error('Invalid Creative Hub backup');if(confirm('Replace all current dashboard data with this backup?')){data=obj;for(const k of Object.keys(initial))if(!(k in data))data[k]=structuredClone(initial[k]);mergeV3(mergeHubV25(data));save();render()}}catch(err){alert('Could not import: '+err.message)}e.target.value=''}render();

let hubDraft=[],hubBusy=0,hubToken='',hubSha=null,hubKnown=false,hubSyncBusy=false;

function hubValidImage(x){return typeof x==='string'&&/^data:image\/(png|jpeg|webp|gif);base64,[A-Za-z0-9+/=]+$/.test(x)}
function hubZoom(src){if(!hubValidImage(src))return;let d=document.getElementById('hubLightbox');if(!d){d=document.createElement('dialog');d.id='hubLightbox';d.innerHTML='<button type="button" onclick="this.parentNode.close()">Close</button><img alt="Reference image">';document.body.append(d)}d.querySelector('img').src=src;d.showModal()}
function hubGallery(images,remove){const wrap=document.createElement('div');wrap.className='hub-gallery';(images||[]).forEach((src,i)=>{if(!hubValidImage(src))return;const cell=document.createElement('div'),img=document.createElement('img');img.src=src;img.alt='Reference '+(i+1);img.loading='lazy';img.onclick=()=>hubZoom(src);cell.append(img);if(remove){const b=document.createElement('button');b.type='button';b.textContent='Remove';b.onclick=()=>{hubDraft.splice(i,1);hubPreview()};cell.append(b)}wrap.append(cell)});return wrap}
function hubPreview(){document.getElementById('hubPreviews').replaceChildren(hubGallery(hubDraft,true))}
async function hubAdd(files){hubBusy++;const draft=hubDraft;try{for(const f of files){if(!/^image\/(png|jpeg|webp|gif)$/.test(f.type))continue;if(f.size>30e6){alert('Image exceeds 30 MB');continue}let bitmap=await createImageBitmap(f);try{const factor=Math.min(1,1200/Math.max(bitmap.width,bitmap.height)),c=document.createElement('canvas');c.width=Math.max(1,Math.round(bitmap.width*factor));c.height=Math.max(1,Math.round(bitmap.height*factor));c.getContext('2d').drawImage(bitmap,0,0,c.width,c.height);draft.push(c.toDataURL('image/webp',.82))}finally{bitmap.close()}}if(draft===hubDraft)hubPreview()}catch(e){alert('Image import failed: '+e.message)}finally{hubBusy--}}

render=function(){hubOldRender();hubDecorate()};refreshTable=function(k){hubOldRefresh(k);hubDecorate()};
function hubStatus(t){document.getElementById('hubSyncStatus').textContent=t}
function hubConnect(){const t=prompt('Enter a fine-grained GitHub personal access token restricted to creative-hub, Contents: Read and write. Stored only in this tab memory. Cancel to disconnect.');hubToken=t?.trim()||'';hubSha=null;hubKnown=false;hubStatus(hubToken?'Token entered; download shared data first':'Disconnected')}
function hubB64(s){const bytes=new TextEncoder().encode(s);let binary='';for(let i=0;i<bytes.length;i+=8192)binary+=String.fromCharCode(...bytes.subarray(i,i+8192));return btoa(binary)}
async function hubRead(){const headers={Accept:'application/vnd.github+json'};if(hubToken)headers.Authorization='Bearer '+hubToken;const response=await fetch(hubRepo,{headers,cache:'no-store'});if(response.status===404)return null;if(!response.ok)throw Error('GitHub HTTP '+response.status);return response.json()}
async function hubPull(){if(hubSyncBusy)return;hubSyncBusy=true;try{const file=await hubRead();if(!file){hubSha=null;hubKnown=true;hubStatus('No shared data file yet');return}if(file.encoding!=='base64')throw Error('Shared file exceeds supported size');const obj=JSON.parse(new TextDecoder().decode(Uint8Array.from(atob(file.content),c=>c.charCodeAt(0))));if(!Array.isArray(obj.videos)||!Array.isArray(obj.packaging))throw Error('Invalid shared data');if(!confirm('Replace local data with public GitHub data? Export a backup first if you have unsaved changes.'))return;data=obj;for(const k of Object.keys(initial))if(!(k in data))data[k]=structuredClone(initial[k]);mergeV3(mergeHubV25(data));save();hubSha=file.sha;hubKnown=true;render();hubStatus('Downloaded shared data')}catch(e){hubStatus(e.message)}finally{hubSyncBusy=false}}
async function hubPush(){if(hubSyncBusy)return;if(!hubToken){hubStatus('Sign in with a write token first');return}if(!confirm('Publish ALL current entries, notes, progress and images publicly on GitHub?'))return;hubSyncBusy=true;try{const file=await hubRead();if(file&&(!hubKnown||file.sha!==hubSha))throw Error('Remote data exists or changed. Export local backup, then download shared data before publishing.');const json=JSON.stringify(data,null,2);if(new TextEncoder().encode(json).length>950000)throw Error('Shared backup exceeds 950 KB limit; export backup. Separate image storage is needed.');const body={message:'Update Creative Hub shared data',content:hubB64(json),branch:'main'};if(file)body.sha=file.sha;const res=await fetch(hubRepo,{method:'PUT',headers:{Authorization:'Bearer '+hubToken,Accept:'application/vnd.github+json','Content-Type':'application/json'},body:JSON.stringify(body)});if(!res.ok)throw Error('GitHub write HTTP '+res.status);const result=await res.json();hubSha=result.content.sha;hubKnown=true;hubStatus('Published to GitHub: '+result.commit.sha.slice(0,7))}catch(e){hubStatus(e.message)}finally{hubSyncBusy=false}}
render();
